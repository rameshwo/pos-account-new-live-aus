name: Deploy to Production

on:
  push:
    tags:
      - 'v*'

env:
  FLUTTER_VERSION: '3.6.0'
  JAVA_VERSION: '11'

jobs:
  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create release notes
        run: |
          echo "## Release v${{ steps.version.outputs.VERSION }}" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### Build Information" >> RELEASE_NOTES.md
          echo "- Build Date: $(date)" >> RELEASE_NOTES.md
          echo "- Flutter Version: 3.6.0" >> RELEASE_NOTES.md
          echo "- GitHub Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          release_name: Release v${{ steps.version.outputs.VERSION }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false

  build_production_apk:
    name: Build Production APK
    runs-on: ubuntu-latest
    needs: create_release
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get Flutter packages
        run: flutter pub get

      - name: Run tests
        run: flutter test --coverage

      - name: Build APK
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            -t lib/main_prod.dart \
            --dart-define=FLAVOR=prod \
            --build-number=${{ github.run_number }}

      - name: Build App Bundle
        run: |
          flutter build appbundle \
            --release \
            -t lib/main_prod.dart \
            --dart-define=FLAVOR=prod \
            --build-number=${{ github.run_number }}

      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: build/app/outputs/flutter-apk/app-release.apk
          asset_name: pos-account-v${{ steps.version.outputs.VERSION }}.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Upload Bundle artifacts
        uses: actions/upload-artifact@v3
        with:
          name: app-bundle
          path: build/app/outputs/bundle/release/
          retention-days: 30

  build_production_ios:
    name: Build Production iOS
    runs-on: macos-latest
    needs: create_release
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get Flutter packages
        run: flutter pub get

      - name: Build iOS
        run: |
          flutter build ios \
            --release \
            -t lib/main_prod.dart \
            --dart-define=FLAVOR=prod \
            --build-number=${{ github.run_number }} \
            --no-codesign

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v3
        with:
          name: ios-build-v${{ steps.version.outputs.VERSION }}
          path: build/ios/iphoneos/
          retention-days: 30

  notify_slack:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [ build_production_apk, build_production_ios ]
    if: always()

    steps:
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "POSApt Production Release v${{ steps.version.outputs.VERSION }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "✅ POSApt Production Release v${{ steps.version.outputs.VERSION }}",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Status:*\n${{ job.status }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Release:*\nv${{ steps.version.outputs.VERSION }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.VERSION }}|View Release>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
