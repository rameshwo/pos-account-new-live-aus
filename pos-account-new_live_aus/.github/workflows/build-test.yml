name: Build & Test

on:
  push:
    branches: [ main, develop, staging ]
  pull_request:
    branches: [ main, develop, staging ]

env:
  FLUTTER_VERSION: '3.6.0'
  JAVA_VERSION: '11'

jobs:
  analyze:
    name: Code Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get Flutter packages
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Check formatting
        run: dart format --set-exit-if-changed .

  unit_tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get Flutter packages
        run: flutter pub get

      - name: Run unit tests
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false

  widget_tests:
    name: Widget Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get Flutter packages
        run: flutter pub get

      - name: Run widget tests
        run: flutter test test/widget_test.dart

  build_uat:
    name: Build UAT APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ analyze, unit_tests, widget_tests ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get Flutter packages
        run: flutter pub get

      - name: Build UAT APK
        run: |
          flutter build apk \
            --split-per-abi \
            -t lib/main_uat.dart \
            --dart-define=FLAVOR=uat \
            --build-number=${{ github.run_number }}

      - name: Upload UAT APK artifacts
        uses: actions/upload-artifact@v3
        with:
          name: pos-account-uat-apk
          path: build/app/outputs/flutter-apk/
          retention-days: 30

  build_prod:
    name: Build PROD APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ analyze, unit_tests, widget_tests ]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get Flutter packages
        run: flutter pub get

      - name: Build PROD APK
        run: |
          flutter build apk \
            --split-per-abi \
            -t lib/main_prod.dart \
            --dart-define=FLAVOR=prod \
            --build-number=${{ github.run_number }}

      - name: Upload PROD APK artifacts
        uses: actions/upload-artifact@v3
        with:
          name: pos-account-prod-apk
          path: build/app/outputs/flutter-apk/
          retention-days: 30

  build_ios_uat:
    name: Build iOS UAT
    runs-on: macos-latest
    timeout-minutes: 30
    needs: [ analyze, unit_tests, widget_tests ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get Flutter packages
        run: flutter pub get

      - name: Build iOS UAT
        run: |
          flutter build ios \
            -t lib/main_uat.dart \
            --dart-define=FLAVOR=uat \
            --build-number=${{ github.run_number }} \
            --no-codesign

      - name: Upload iOS UAT artifacts
        uses: actions/upload-artifact@v3
        with:
          name: pos-account-ios-uat
          path: build/ios/iphoneos/
          retention-days: 30

  build_ios_prod:
    name: Build iOS PROD
    runs-on: macos-latest
    timeout-minutes: 30
    needs: [ analyze, unit_tests, widget_tests ]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get Flutter packages
        run: flutter pub get

      - name: Build iOS PROD
        run: |
          flutter build ios \
            -t lib/main_prod.dart \
            --dart-define=FLAVOR=prod \
            --build-number=${{ github.run_number }} \
            --no-codesign

      - name: Upload iOS PROD artifacts
        uses: actions/upload-artifact@v3
        with:
          name: pos-account-ios-prod
          path: build/ios/iphoneos/
          retention-days: 30

  security_scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run security audit
        run: |
          dart pub global activate dartdoc
          # Check for known vulnerabilities in dependencies
          flutter pub outdated --exit-if-changed

  publish_test_results:
    name: Publish Test Results
    runs-on: ubuntu-latest
    needs: [ unit_tests, widget_tests ]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get Flutter packages
        run: flutter pub get

      - name: Generate test report
        run: flutter test --machine > test-results.json
        continue-on-error: true
